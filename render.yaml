# Render blueprint.
#
# One Web Service: the API serves the files and its internal scheduler runs
# the forecast every day. Render Cron Jobs cannot mount a persistent disk,
# which is why the daily run lives inside the web service.
#
# Plan: the pipeline loads ConvLSTM models into memory, one region at a time.
# Use 'standard' (2 GB) or higher; 'starter' (512 MB) is not enough.

services:
  - type: web
    name: lightning-prediction-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true

    disk:
      name: lightning-data
      mountPath: /var/data
      sizeGB: 10

    envVars:
      - key: DATA_DIR
        value: /var/data

      # UTC time of the daily run (the 00z GFS completes around 05:30 UTC).
      - key: RUN_AT_UTC
        value: "07:30"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: RUN_ON_STARTUP
        value: "true"

      - key: HORIZON_HOURS
        value: "48"
      - key: PROB_THRESHOLD
        value: "0.15"
      - key: KEEP_RUNS
        value: "4"

      # Key for the admin endpoints (generated by Render).
      - key: API_KEY
        generateValue: true

      # --- models on Google Drive: fill these in the Render dashboard ---
      # Simplest option: one .zip holding Model-Trained/ and Model-Trained-new/
      - key: GDRIVE_ASSETS_ZIP_ID
        sync: false
      # Service account credential with read access (paste the whole JSON).
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false

      # Origins allowed by CORS (the web page that consumes this API).
      - key: CORS_ORIGINS
        value: "*"
