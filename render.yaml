# Render blueprint.
#
# This service only SERVES: status, manifests, and the files of whatever runs are on disk. It does not
# compute the forecast any more -- that moved to .github/workflows/forecast.yml, which runs on a GitHub
# runner and publishes the products as a release on lightning-data-prediction.
#
# Why it moved: the pipeline loads TensorFlow plus the ConvLSTM models. TensorFlow alone takes 425 MB
# just to import (measured), against the 512 MB of a free instance, and a free instance has no
# persistent disk and spins down when idle, so a finished run would not survive to be served. A plan
# that fits is a second subscription for something that runs once a day. A GitHub runner has 7 GB of
# RAM, real cron, and costs nothing on this schedule.
#
# So: free plan, no disk, scheduler off. The map reads the forecast from the release, not from here.

services:
  - type: web
    name: lightning-prediction-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Ephemeral on the free plan, which is fine: nothing here is computed or kept.
      - key: DATA_DIR
        value: /var/data

      # The run lives in GitHub Actions now. Left on, these would try the pipeline at every restart
      # and fail for want of memory and models, filling the log with a failure nobody should act on.
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: RUN_ON_STARTUP
        value: "false"

      - key: HORIZON_HOURS
        value: "48"
      - key: PROB_THRESHOLD
        value: "0.15"
      - key: KEEP_RUNS
        value: "4"

      # Key for the admin endpoints (generated by Render).
      - key: API_KEY
        generateValue: true

      # --- models on Google Drive: fill these in the Render dashboard ---
      # Simplest option: one .zip holding Model-Trained/ and Model-Trained-new/
      - key: GDRIVE_ASSETS_ZIP_ID
        sync: false
      # Service account credential with read access (paste the whole JSON).
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false

      # Origins allowed by CORS (the web page that consumes this API).
      - key: CORS_ORIGINS
        value: "*"
