# Daily: run the forecast from both models (GFS and ECMWF IFS) and publish the products as a
# release on lightning-data-prediction, where the map reads them.
#
# Why here and not on the web service: the pipeline needs TensorFlow plus the ConvLSTM models, which
# does not fit the 512 MB of a free Render instance -- and a paid one is a second subscription for
# something that runs once a day for a few dozen minutes. A GitHub runner has 7 GB of RAM and 14 GB of
# disk, costs nothing on this schedule. The result goes to a release asset rather than object storage
# because that needs no payment card and no new account, and GitHub serves release assets with
# Last-Modified and ETag -- which is all the consumer checks before deciding to download.
#
# 07:30 UTC: the 00z GFS finishes arriving around 05:30 UTC.
name: Previsão → release

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data de referência (YYYY-MM-DD). Vazio = hoje em UTC."
        required: false
      force:
        description: "Reprocessar mesmo se a rodada já existir"
        type: boolean
        default: false
      sources:
        description: "Modelos de entrada (gfs, ecmwf, ou os dois separados por vírgula)"
        required: false
        default: "gfs,ecmwf"

concurrency:
  group: previsao-release
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Until the secrets are set, say so and stop instead of failing every morning.
      - name: Conferir configuração
        id: config
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GDRIVE_ASSETS_ZIP_ID: ${{ secrets.GDRIVE_ASSETS_ZIP_ID }}
        run: |
          faltam=""
          [ -z "$DATA_REPO_TOKEN" ] && faltam="$faltam DATA_REPO_TOKEN"
          [ -z "$GDRIVE_ASSETS_ZIP_ID" ] && faltam="$faltam GDRIVE_ASSETS_ZIP_ID"
          if [ -n "$faltam" ]; then
            echo "::notice::Faltam segredos:$faltam — nada publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # A release needs a commit to hang its tag on: on a repository with no commits at all the API
      # answers 422 "Repository is empty", and it would answer that after the forecast had already
      # run for forty minutes. So the first commit is made here, before any of the work.
      - if: steps.config.outputs.ok == 'true'
        name: Conferir o repositório de dados
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO: storm-forecast/lightning-data-prediction
        run: |
          set -e
          if ! gh api "repos/$REPO" >/dev/null 2>&1; then
            echo "::error::DATA_REPO_TOKEN não enxerga $REPO. O token precisa de acesso de escrita" \
                 "(contents) nesse repositório."
            exit 1
          fi
          # The commits endpoint answers 409 on an empty repository; anything else means it has history.
          if gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
            exit 0
          fi
          echo "$REPO está vazio — criando o primeiro commit."
          LEIAME=$(base64 -w0 <<'MD'
          # lightning-data-prediction

          Saída da previsão de raios, publicada como release pelo workflow do repositório do serviço.

          - Tag `latest`: sobrescrita a cada rodada, é o que o mapa lê.
          - Tags `YYYY-MM-DD`: a cópia daquele dia, guardada para conferir depois.
          MD
          )
          gh api --method PUT "repos/$REPO/contents/README.md" \
            -f message="Primeiro commit" -f content="$LEIAME" >/dev/null

      - if: steps.config.outputs.ok == 'true'
        uses: actions/checkout@v4

      # 3.12 is required, not incidental: the regressors carry a Lambda layer whose function Keras
      # saved as marshalled CPython bytecode from Colab, and that format does not survive a minor
      # version change -- see the Dockerfile for what breaks.
      - if: steps.config.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - if: steps.config.outputs.ok == 'true'
        name: libeccodes (pygrib lê GRIB2 com ela)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libeccodes0 libeccodes-dev

      - if: steps.config.outputs.ok == 'true'
        run: pip install -r requirements.txt gdown

      # The models are 3.1 GB and do not change between runs, so they are cached. The cache limit is
      # 10 GB per repository; this fits with room to spare only because the models were re-saved
      # without the optimizer state, which took them from 9.3 GB.
      - if: steps.config.outputs.ok == 'true'
        id: cache-modelos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/assets
          key: modelos-${{ secrets.GDRIVE_ASSETS_ZIP_ID }}

      - if: steps.config.outputs.ok == 'true' && steps.cache-modelos.outputs.cache-hit != 'true'
        name: Baixar os modelos do Drive
        env:
          ID_OU_LINK: ${{ secrets.GDRIVE_ASSETS_ZIP_ID }}
        run: |
          mkdir -p "${{ runner.temp }}/assets"
          # The secret holds the file id, but a share link pasted whole is the natural mistake and
          # costs nothing to accept. --fuzzy pulls the id out of a url; --id is deprecated in gdown 5.
          case "$ID_OU_LINK" in
            *drive.google.com*) URL="$ID_OU_LINK" ;;
            *)                  URL="https://drive.google.com/uc?id=$ID_OU_LINK" ;;
          esac
          gdown --fuzzy "$URL" -O "${{ runner.temp }}/modelos.zip"
          # A restricted file comes back as Google's sign-in page, which unzip would reject with a
          # message about the central directory -- unhelpful. Say the real cause instead.
          if ! unzip -tq "${{ runner.temp }}/modelos.zip" >/dev/null 2>&1; then
            echo "::error::O que o Drive devolveu não é um zip. O arquivo provavelmente não está" \
                 "compartilhado como 'Qualquer pessoa com o link'."
            head -c 200 "${{ runner.temp }}/modelos.zip"
            exit 1
          fi
          unzip -q "${{ runner.temp }}/modelos.zip" -d "${{ runner.temp }}/assets"
          rm "${{ runner.temp }}/modelos.zip"
          du -sh "${{ runner.temp }}/assets"

      - if: steps.config.outputs.ok == 'true'
        name: Rodar a previsão
        env:
          DATA_DIR: ${{ runner.temp }}/data
          ASSETS_LOCAL_DIR: ${{ runner.temp }}/assets
          HORIZON_HOURS: "48"
          PROB_THRESHOLD: "0.15"
          KEEP_RUNS: "1"           # the runner is thrown away; only this run matters
          PRECIP_GLOBAL: "true"    # rain needs no model, so it is not confined to South America
          ENABLE_SCHEDULER: "false"
          # Both models, one run. They are independent: if the ECMWF bucket is late the GFS
          # products still publish, and vice versa.
          SOURCES: ${{ inputs.sources || 'gfs,ecmwf' }}
        run: |
          python -m worker.run_daily \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - if: steps.config.outputs.ok == 'true'
        name: Publicar a previsão
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REPO: storm-forecast/lightning-data-prediction
          TAG: latest
        run: |
          set -e
          RUN_DIR=$(find "${{ runner.temp }}/data/products" -mindepth 1 -maxdepth 1 -type d \
                      -name '20*' | sort | tail -1)
          if [ -z "$RUN_DIR" ]; then
            echo "::error::A rodada não deixou diretório de produtos."
            exit 1
          fi
          echo "rodada: $RUN_DIR"

          # What the consumers are configured to fetch, per source: the smoothed lightning field
          # and the precipitation products. The per-region files and the unsmoothed merge stay
          # behind -- they are intermediate, and every asset here costs bandwidth on each poll.
          ESPERADOS="
            lightning/gfs_prediction_ALL_regions_suavisado.nc
            lightning/ifs_prediction_ALL_regions_suavisado.nc
            precipitation/gfs_precipitation.nc
            precipitation/gfs_precipitation_suavisado.nc
            precipitation/gfs_precipitation_global.nc
            precipitation/ifs_precipitation.nc
            precipitation/ifs_precipitation_suavisado.nc
            precipitation/ifs_precipitation_global.nc
          "

          ARQUIVOS=""
          for rel in $ESPERADOS; do
            if [ -f "$RUN_DIR/$rel" ]; then
              echo "  ok      $rel ($(du -h "$RUN_DIR/$rel" | cut -f1))"
              ARQUIVOS="$ARQUIVOS $RUN_DIR/$rel"
            else
              # Not fatal: a source whose bucket was late leaves its files out, and the other
              # source's forecast is still worth publishing.
              echo "::warning::não produzido: $rel"
            fi
          done

          if [ -z "$ARQUIVOS" ]; then
            echo "::error::Nenhum produto esperado foi gerado."
            exit 1
          fi

          # One tag, overwritten: the consumer is configured with a single URL and has no way to
          # learn a new run id each day. --clobber replaces the asset, which gives it a fresh
          # Last-Modified and ETag -- the two headers the consumer polls on.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "Previsão mais recente" \
                 --notes "Sobrescrito a cada rodada. Veja o README para o que há dentro."
          gh release upload "$TAG" $ARQUIVOS --repo "$REPO" --clobber

          # A dated copy as well, so there is a record to measure against later: today's forecast is
          # the only thing that can be checked tomorrow, and overwriting it leaves nothing to check.
          DATA=$(date -u +%Y-%m-%d)
          gh release view "$DATA" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$DATA" --repo "$REPO" --title "Previsão de $DATA" --notes "Arquivo."
          gh release upload "$DATA" $ARQUIVOS --repo "$REPO" --clobber

          echo
          echo "publicado em https://github.com/$REPO/releases/tag/$TAG"
          for f in $ARQUIVOS; do
            echo "  https://github.com/$REPO/releases/download/$TAG/$(basename "$f")"
          done
